name: Appearance presets real browser (synthetic)

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'compose.staging.yaml'
      - 'compose.bootstrap.yaml'
      - 'docker/staging/provision-env.sh'
      - 'app/Services/Staging/**'
      - 'database/migrations/**'
      - 'docker/staging/**'
      - 'tests/staging/integration/docker-apache.sh'
      - 'tests/staging/integration/theme-browser.cjs'
      - '.github/workflows/staging-theme-browser.yml'
      - 'resources/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite*.js'
  workflow_dispatch:

permissions:
  contents: read
  actions: write # Buildx layer cache only; never writes repository content.

concurrency:
  group: staging-theme-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  theme-browser:
    name: Six palettes on real Chromium and Docker Core
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      STAGING_APP_IMAGE: rconfig-custom-ci:apache

    steps:
      - name: Checkout exact PR test source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build source image pinned to tested GitHub commit
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.STAGING_APP_IMAGE }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=staging-theme-browser
          cache-to: type=gha,mode=max,scope=staging-theme-browser

      - name: Prepare version-matched hosted browser tools
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          grep -Fxq tests .dockerignore
          bash -n tests/staging/integration/docker-apache.sh
          node --check tests/staging/integration/theme-browser.cjs
          browser_dir="$RUNNER_TEMP/rconfig-theme-browser"
          evidence="$RUNNER_TEMP/rconfig-theme-evidence"
          mkdir -m 0700 "$browser_dir" "$evidence"
          cp tests/staging/integration/theme-browser.cjs "$browser_dir/"
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 npm install --prefix "$browser_dir" --no-save --ignore-scripts --no-audit --no-fund playwright@1.64.1
          docker pull mcr.microsoft.com/playwright:v1.64.1-noble
          echo "THEME_BROWSER_DIR=$browser_dir" >> "$GITHUB_ENV"
          echo "THEME_BROWSER_OUTPUT=$evidence" >> "$GITHUB_ENV"

      - name: Authenticate and exercise all six palettes in Chromium
        shell: bash
        run: |
          set -euo pipefail
          bash tests/staging/integration/docker-apache.sh --theme-browser

      - name: Retain synthetic screenshots and token contrast only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-theme-browser-evidence
          path: |
            ${{ runner.temp }}/rconfig-theme-evidence/*.png
            ${{ runner.temp }}/rconfig-theme-evidence/contrast.json
          if-no-files-found: warn
          retention-days: 7
