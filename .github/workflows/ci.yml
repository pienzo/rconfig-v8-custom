name: CI

on:
  pull_request:

# Least privilege: these jobs only read the repo, never write back.
permissions:
  contents: read

# Cancel superseded runs for the same ref (e.g. rapid pushes, or push + PR on the same branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# composer install runs package:discover, which boots the framework and loads the
# route files. Those resolve paths from APP_DIR_PATH, whose default is the production
# deploy path (/var/www/html/rconfig8/current). On a runner the repo lives in the
# workspace, so point it there or the route requires fail with "No such file".
env:
  APP_DIR_PATH: ${{ github.workspace }}

jobs:
  pint:
    name: Code Style (Pint)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        # actions/checkout v6.0.2 (runs on Node 24)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup PHP
        # shivammathur/setup-php v2.37.1
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          # Only the hard-required extensions not already bundled in the base PHP build.
          php-version: '8.4'
          extensions: ftp, gd, ldap, sockets
          coverage: none

      - name: Prepare .env
        run: cp .env.example .env

      - name: Use SQLite for framework boot
        run: |
          touch "${{ github.workspace }}/database/database.sqlite"
          {
            echo "DB_CONNECTION=sqlite"
            echo "DB_DATABASE=${{ github.workspace }}/database/database.sqlite"
          } >> .env

      - name: Install Composer dependencies
        # ramsey/composer-install v4.0.0 (uses actions/cache v5, runs on Node 24)
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda

      - name: Run Pint
        run: vendor/bin/pint --test

  phpstan:
    name: Static Analysis (PHPStan)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        # actions/checkout v6.0.2 (runs on Node 24)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup PHP
        # shivammathur/setup-php v2.37.1
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          # Only the hard-required extensions not already bundled in the base PHP build.
          php-version: '8.4'
          extensions: ftp, gd, ldap, sockets
          coverage: none

      - name: Prepare .env
        run: cp .env.example .env

      - name: Use SQLite for framework boot
        run: |
          touch "${{ github.workspace }}/database/database.sqlite"
          {
            echo "DB_CONNECTION=sqlite"
            echo "DB_DATABASE=${{ github.workspace }}/database/database.sqlite"
          } >> .env

      - name: Install Composer dependencies
        # ramsey/composer-install v4.0.0 (uses actions/cache v5, runs on Node 24)
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda

      - name: Cache PHPStan result cache
        # actions/cache v5.0.5 (runs on Node 24)
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: .phpstan
          # Save a fresh cache per commit; fall back to the most recent prior run for incremental reuse.
          key: phpstan-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            phpstan-${{ runner.os }}-

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=-1 --error-format=github

  eslint:
    name: Frontend Lint (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        # actions/checkout v6.0.2 (runs on Node 24)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node
        # actions/setup-node v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          # Pinned to the current LTS
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  vitest:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        # actions/checkout v6.0.2 (runs on Node 24)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node
        # actions/setup-node v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          # Pinned to the current LTS
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run Vitest
        run: npm test

  tests:
    name: Tests (Unit + Fasttests)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # Forces custom_chown()'s suppressed-vs-loud branch (app/Http/Helpers.php) for
      # every step in this job, not just the phpunit-invoked test run — the runner
      # user can't chown() to apache/www-data (needs CAP_CHOWN), and that's expected
      # here, not a real deployment problem worth failing loudly over.
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: v8core_test
      DB_USERNAME: root
      DB_PASSWORD: ""
      TEST_DB_MYSQL_HOST: 127.0.0.1
      TEST_DB_MYSQL_PORT: 3306
      TEST_DB_MYSQL_DATABASE: v8core_test
      TEST_DB_MYSQL_USERNAME: root
      TEST_DB_MYSQL_PASSWORD: ""
      # Read by config/database.php's 'redis' connection (predis client).
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: true
          MYSQL_DATABASE: v8core_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: '8.4'
          extensions: ftp, gd, ldap, sockets, pdo_mysql
          coverage: none

      - name: Prepare .env.testing
        # tests/CreatesApplication.php forces .env.testing for every Unit/Fasttests
        # test regardless of APP_ENV, and it's gitignored (developer-machine-only),
        # so CI has to create its own throwaway copy rather than relying on plain .env.
        run: cp .env.example .env.testing

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda

      - name: Generate app key
        # APP_ENV=testing (job env, above) + .env.testing already existing means
        # Laravel's normal bootstrap resolves .env.testing as the target file here,
        # matching the file tests/CreatesApplication.php force-loads for every test.
        run: php artisan key:generate --force

      - name: Run Unit + Fasttests
        run: php artisan test --compact tests/Unit tests/Fasttests --exclude-group=device-hardware --exclude-group=external-network --exclude-group=local-daemon

      - name: Test F02 Linux openat2 prototype (synthetic only)
        # Untrusted PRs get no secrets or elevated privileges; run only on throwaway runner directories.
        # This is NOT evidence of F02 production admission or an OS-integrated opener.
        run: python3 -m unittest discover -s tools/f02/linux/tests -p 'test_*.py' -v

      - name: Test F02 true two-worker MySQL idempotency (synthetic only)
        # Runs after Core tests so migrated MySQL schema is available. Hard-gated
        # to APP_ENV=testing and an ephemeral database named v8core_test.
        # Both subprocesses use distinct DB connections; no file receipts or backup success.
        run: F02_SYNTHETIC_CONCURRENCY=1 php tools/f02/concurrency/run.php

      - name: Test F02 worker crash rollback and postcommit retry (synthetic only)
        # Only isolated PHP subprocesses on hosted Linux are SIGKILLed.
        # Requires APP_ENV=testing, v8core_test, and F02_SYNTHETIC_CONCURRENCY.
        # No real scheduler, backup contents or production connections.
        run: F02_SYNTHETIC_CONCURRENCY=1 php tools/f02/concurrency/crash_recovery.php

      - name: Test F02 real Redis worker crash and redelivery (synthetic only)
        # Uses the existing hosted Redis/MySQL services and a random test-only queue.
        # A short reservation is configured IN MEMORY only for an isolated worker.
        # SIGKILL targets only its own PHP queue:work subprocess, never Horizon.
        run: F02_SYNTHETIC_REDIS_QUEUE=1 php tools/f02/queue/redelivery.php

      
      - name: Test F02 real native SHA-256 through Laravel worker and receipt (hosted only)
        # Compiles the same unprivileged helper as Dockerfile on a throwaway
        # GitHub Linux runner. These tests explicitly enable F02 only in-process.
        # Not proof of uploader finalization or authorized staging deployment.
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror tools/f02/linux/f02_safe_digest.c \
            -lcrypto -o "$RUNNER_TEMP/rconfig-f02-safe-digest"
          F02_NATIVE_E2E_BINARY="$RUNNER_TEMP/rconfig-f02-safe-digest" \
            php artisan test --compact tests/Fasttests/ExternalBackups/ExternalBackupRealNativeWorkerIntegrationTest.php

      - name: Test F03 real MySQL concurrent delivery claims and crash (hosted only)
        # Independent processes; local synthetic effect, no provider calls.
        run: F03_SYNTHETIC_DELIVERY_CLAIM=1 php tools/f03/delivery_claim.php

      - name: Test actual F02 schedule event through Horizon and native receipt (hosted only)
        # Dedicated Redis logical DBs on the disposable service, no provider.
        shell: bash
        run: |
          set -euo pipefail
          inbox="$(mktemp -d "$RUNNER_TEMP/rconfig-f02-horizon.XXXXXXXX")"
          chmod 700 "$inbox"
          trap 'rmdir "$inbox"; rm -f "$RUNNER_TEMP/f02-scheduled-receipt.log"' EXIT
          F02_SYNTHETIC_HORIZON=1 REDIS_DB=13 REDIS_CACHE_DB=14 \
            QUEUE_CONNECTION=redis CACHE_DRIVER=redis CACHE_STORE=redis MAIL_MAILER=log \
            RCONFIG_F02_RUNTIME_ENABLED=true RCONFIG_F02_QUEUE_ENABLED=true \
            RCONFIG_F02_RECEIPT_ACCEPTANCE_ENABLED=true RCONFIG_F02_FINALIZATION_APPROVED=true \
            RCONFIG_F02_RECEIPT_HMAC_KEY="base64:$(openssl rand -base64 32)" \
            RCONFIG_EXTERNAL_BACKUP_INTAKE_ROOT="$inbox" \
            RCONFIG_F02_NATIVE_DIGEST_BINARY="$RUNNER_TEMP/rconfig-f02-safe-digest" \
            RCONFIG_CUSTOM_BACKUP_NOTIFICATIONS_ENABLED=false RCONFIG_NATIVE_BACKUP_NOTIFICATIONS_ENABLED=false \
            RCONFIG_TELEGRAM_ENABLED=false RCONFIG_BACKUP_EMAIL_ENABLED=false RCONFIG_WHATSAPP_ENABLED=false \
            php tools/f02/queue/scheduled_receipt.php | tee "$RUNNER_TEMP/f02-scheduled-receipt.log"
          grep -Fxq 'F02 REAL_SCHEDULE_EVENT_HORIZON_NATIVE_RECEIPT_OK (SYNTHETIC_ONLY)' "$RUNNER_TEMP/f02-scheduled-receipt.log"

      - name: Test actual SFTP file through scheduled Horizon receipt (hosted only)
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          context="$(mktemp -d "$RUNNER_TEMP/f02-sftp-context.XXXXXXXX")"
          # Check the actual host ancestry rather than assuming /opt is protected.
          for parent in / /var /var/lib; do
            test "$(realpath "$parent")" = "$parent"
            test "$(stat -c '%u' "$parent")" = 0
            perms="$(stat -c '%a' "$parent")"
            (( (8#$perms & 0022) == 0 ))
            test ! -w "$parent"
          done
          inbox="$(sudo mktemp -d /var/lib/rconfig-f02-horizon.XXXXXXXX)"
          cleanup() {
            rm -f -- "$context/Dockerfile" "$context/run.sh" "$context/handoff.py" "$context/f02_safe_digest.c"
            rmdir -- "$context"
            sudo find "$inbox" -xdev -mindepth 1 -maxdepth 2 -delete
            sudo rmdir -- "$inbox"
            rm -f -- "$RUNNER_TEMP/f02-sftp-receipt.log" "$RUNNER_TEMP/f02-sftp-negative.log" "$RUNNER_TEMP/f02-sftp-multi-receipt.log"
          }
          trap cleanup EXIT
          sudo chown "0:$(id -g)" "$inbox"
          sudo chmod 0750 "$inbox"
          cp tests/staging/f02-sftp/{Dockerfile,run.sh,handoff.py} "$context/"
          cp tools/f02/linux/f02_safe_digest.c "$context/"
          docker build -t rconfig-f02-sftp-ci "$context"
          run_sftp_probe() {
            F02_SYNTHETIC_SFTP_RECEIPT=1 F02_SYNTHETIC_HORIZON=1 REDIS_DB="${1:-11}" REDIS_CACHE_DB="${2:-12}" \
            F02_SYNTHETIC_MULTI_RECEIPT="${3:-0}" \
            HORIZON_PREFIX="f02_sftp_ci_${3:-0}:" CACHE_PREFIX="f02_sftp_ci_${3:-0}" \
            QUEUE_CONNECTION=redis CACHE_DRIVER=redis CACHE_STORE=redis MAIL_MAILER=log \
            RCONFIG_F02_RUNTIME_ENABLED=true RCONFIG_F02_QUEUE_ENABLED=true \
            RCONFIG_F02_RECEIPT_ACCEPTANCE_ENABLED=true RCONFIG_F02_FINALIZATION_APPROVED=true \
            RCONFIG_F02_RECEIPT_HMAC_KEY="base64:$(openssl rand -base64 32)" \
            RCONFIG_EXTERNAL_BACKUP_INTAKE_ROOT="$inbox" \
            RCONFIG_F02_NATIVE_DIGEST_BINARY="$RUNNER_TEMP/rconfig-f02-safe-digest" \
            RCONFIG_CUSTOM_BACKUP_NOTIFICATIONS_ENABLED=false RCONFIG_NATIVE_BACKUP_NOTIFICATIONS_ENABLED=false \
            RCONFIG_TELEGRAM_ENABLED=false RCONFIG_BACKUP_EMAIL_ENABLED=false RCONFIG_WHATSAPP_ENABLED=false \
            php tools/f02/queue/scheduled_receipt.php
          }
          # Deliberately violate the protected root mode after framework boot.
          # Require the precise refusal AND exit 1; never count a rendered error as success.
          sudo chmod 0755 "$inbox"
          status=0
          run_sftp_probe > "$RUNNER_TEMP/f02-sftp-negative.log" 2>&1 || status=$?
          test "$status" -eq 1
          grep -Fxq 'F02 scheduled receipt probe failed: private fixture and native helper' "$RUNNER_TEMP/f02-sftp-negative.log"
          printf '%s\n' 'F02_SFTP_PREFLIGHT_FAIL_CLOSED_OK (SYNTHETIC_ONLY)'
          sudo chmod 0750 "$inbox"
          run_sftp_probe | tee "$RUNNER_TEMP/f02-sftp-receipt.log"
          grep -Fxq 'F02_SFTP_PUBLISHED_INODE_READY (SYNTHETIC_ONLY)' "$RUNNER_TEMP/f02-sftp-receipt.log"
          grep -Fxq 'F02_REAL_SFTP_SCHEDULE_HORIZON_RECEIPT_OK (SYNTHETIC_ONLY)' "$RUNNER_TEMP/f02-sftp-receipt.log"
          grep -Fxq 'F02 REAL_SCHEDULE_EVENT_HORIZON_NATIVE_RECEIPT_OK (SYNTHETIC_ONLY)' "$RUNNER_TEMP/f02-sftp-receipt.log"
          # Only the disposable root created above; first worker has stopped.
          sudo find "$inbox" -xdev -mindepth 1 -maxdepth 2 -delete
          test -z "$(ls -A "$inbox")"
          run_sftp_probe 9 10 1 | tee "$RUNNER_TEMP/f02-sftp-multi-receipt.log"
          grep -Fxq 'F02_MULTI_DEVICE_EVENTS_QUEUED_OK (SYNTHETIC_ONLY)' "$RUNNER_TEMP/f02-sftp-multi-receipt.log"
          grep -Fxq 'F02_MULTI_DEVICE_EXACT_RECEIPTS_OK (SYNTHETIC_ONLY)' "$RUNNER_TEMP/f02-sftp-multi-receipt.log"
          grep -Fxq 'F02_MULTI_DEVICE_RECEIPT_REPLAY_OK (SYNTHETIC_ONLY)' "$RUNNER_TEMP/f02-sftp-multi-receipt.log"
          grep -Fxq 'F02 REAL_SCHEDULE_EVENT_HORIZON_NATIVE_RECEIPT_OK (SYNTHETIC_ONLY)' "$RUNNER_TEMP/f02-sftp-multi-receipt.log"

      - name: Test F03 actual implicit TLS SMTP and mandatory AUTH (hosted only)
        # Local loopback fixture, ephemeral test CA, no relay or real provider.
        run: F03_SYNTHETIC_SMTP_TLS=1 python3 tools/f03/smtp_tls_probe.py
