name: Staging actual Apache role (synthetic)

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/staging/**'
      - 'compose.staging.yaml'
      - 'app/**'
      - 'bootstrap/**'
      - 'config/**'
      - 'database/migrations/**'
      - 'resources/**'
      - 'routes/**'
      - 'composer.*'
      - 'package*.json'
      - 'tests/staging/integration/docker-apache*'
      - '.github/workflows/staging-apache-role.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apache-role:
    name: Actual Apache staging role and protected bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Build disposable source image
        run: docker build --build-arg "SOURCE_REVISION=$(git rev-parse HEAD)" -t rconfig-custom-ci:apache .
      - name: Real protected bootstrap and Apache role
        run: bash tests/staging/integration/docker-apache.sh
