name: Staging actual roles (synthetic)

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/staging/**'
      - 'compose.staging.yaml'
      - 'app/**'
      - 'bootstrap/**'
      - 'config/**'
      - 'database/migrations/**'
      - 'resources/**'
      - 'routes/**'
      - 'composer.*'
      - 'package*.json'
      - 'tests/staging/integration/docker-apache*'
      - 'tests/staging/integration/docker-combined-roles*'
      - '.github/workflows/staging-apache-role.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apache-role:
    name: Actual Apache staging role and protected bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Build disposable source image
        run: docker build --build-arg "SOURCE_REVISION=$(git rev-parse HEAD)" -t rconfig-custom-ci:apache .
      - name: Real protected bootstrap and Apache role
        run: bash tests/staging/integration/docker-apache.sh

  combined-roles:
    name: Simultaneous Apache Horizon and Scheduler
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Build disposable source image
        run: docker build --build-arg "SOURCE_REVISION=$(git rev-parse HEAD)" -t rconfig-custom-ci:apache .
      - name: Real protected bootstrap and three simultaneous roles
        run: bash tests/staging/integration/docker-apache.sh --combined

  recreate-roles:
    name: Recreate all roles and verify persistence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Build disposable source image
        run: docker build --build-arg "SOURCE_REVISION=$(git rev-parse HEAD)" -t rconfig-custom-ci:apache .
      - name: Real role recreation with preserved state
        run: bash tests/staging/integration/docker-apache.sh --recreate

  restart-infra:
    name: Restart MariaDB Redis AOF and recover all roles
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Build disposable source image
        run: docker build --build-arg "SOURCE_REVISION=$(git rev-parse HEAD)" -t rconfig-custom-ci:apache .
      - name: Controlled infrastructure restart and persistent state
        run: bash tests/staging/integration/docker-apache.sh --infra-restart
